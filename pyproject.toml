[project]
name = "mea-faoj"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "cryptography>=50.0.2,<51",
    "whitenoise>=6.9,<7",
    "openpyxl>=3.1.5",
    "evidently>=0.7.23,<0.8",
    "mcp>=1.26,<2",
    "google-auth[requests]>=2,<3",
    "pypdf>=5,<7",
    "pillow>=12.1,<14",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
    "playwright>=1.50,<2",
    "pip-audit>=2.9,<3",
    "detect-secrets>=1.5,<2",
]

[tool.uv]
required-version = "==0.10.11"
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
