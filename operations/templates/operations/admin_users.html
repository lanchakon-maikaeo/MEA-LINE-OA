{% extends "operations/admin_base.html" %}
{% block content %}
<h1>ผู้ใช้</h1>
<p><a href="{% url 'admin-user-new' %}">เพิ่มบัญชีรายบุคคล</a></p>
<div class="table-wrap"><table>
  <thead><tr><th scope="col">ชื่อผู้ใช้</th><th scope="col">ชื่อ</th><th scope="col">สถานะ</th></tr></thead>
  <tbody>
    {% for u in users %}
      <tr>
        <td><a href="{% url 'admin-user-detail' u.pk %}">{{ u.username }}</a></td>
        <td>{{ u.staff_profile.display_name|default:"-" }}</td>
        <td>{{ u.is_active|yesno:"ใช้งาน,ระงับ" }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table></div>
{% endblock %}
