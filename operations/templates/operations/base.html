<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ระบบรับเรื่อง ฝอจ.{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.5; color: #1a1a1a; background: #fff; }
    header, main { max-width: 960px; margin: 0 auto; padding: 12px 16px; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-bottom: 1px solid #ddd; }
    header nav { display: flex; flex-wrap: wrap; gap: 12px; flex: 1; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
    .table-wrap { overflow-x: auto; }
    .messages li.error { color: #a40000; }
    .messages li.success { color: #1b5e20; }
    form.inline { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    fieldset { margin: 12px 0; }
    input, select, button { font: inherit; padding: 4px 8px; }
    :focus-visible { outline: 3px solid #1565c0; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <strong>ระบบรับเรื่อง ฝอจ.</strong>
    {% if user.is_authenticated %}
      <nav aria-label="เมนูหลัก">
        <a href="{% url 'console' %}">หน้าหลัก</a>
        {% block admin_nav %}{% endblock %}
        <a href="{% url 'password_change' %}">เปลี่ยนรหัสผ่าน</a>
      </nav>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">ออกจากระบบ</button></form>
    {% endif %}
  </header>
  <main>
    {% if messages %}
      <ul class="messages" role="status">
        {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
