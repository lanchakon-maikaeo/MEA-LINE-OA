<form method="post" action="{% url 'admin-push' %}" class="push-switch">{% csrf_token %}<input type="hidden" name="key" value="{{ key }}"><input type="hidden" name="value" value="{% if on %}off{% else %}on{% endif %}"><input type="hidden" name="anchor" value="push-{{ anchor }}"><button type="submit" class="switch" role="switch" aria-checked="{% if on %}true{% else %}false{% endif %}" aria-label="{{ label }}"><span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span><span class="switch__text">{% if on %}ส่ง{% else %}ไม่ส่ง{% endif %}</span></button></form>
