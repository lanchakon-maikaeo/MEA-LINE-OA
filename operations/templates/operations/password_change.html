{% extends "operations/base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน · DED Center{% endblock %}
{% block content %}
<div class="auth">
  <h1>เปลี่ยนรหัสผ่าน</h1>
  {% if user.staff_profile.must_change_password %}<div class="notice notice--warning mb-24" role="alert"><div class="notice__body">ต้องเปลี่ยนรหัสผ่านชั่วคราวก่อนใช้งาน</div></div>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn--block" type="submit">บันทึก</button>
  </form>
</div>
{% endblock %}
