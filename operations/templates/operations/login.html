{% extends "operations/base.html" %}
{% block title %}เข้าสู่ระบบ — ระบบรับเรื่อง ฝอจ.{% endblock %}
{% block content %}
<h1>เข้าสู่ระบบ</h1>
{% if form.errors %}<p role="alert">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p><label for="id_username">ชื่อผู้ใช้</label><br><input id="id_username" name="username" autocomplete="username" required autofocus></p>
  <p><label for="id_password">รหัสผ่าน</label><br><input id="id_password" name="password" type="password" autocomplete="current-password" required></p>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">เข้าสู่ระบบ</button>
</form>
{% endblock %}
