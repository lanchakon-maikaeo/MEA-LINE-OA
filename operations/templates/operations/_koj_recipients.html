<form method="post" action="{% url 'koj-recipients' target.pk %}">
  {% csrf_token %}
  <fieldset><legend>รับแจ้งติดตามงาน กอจ. ผ่าน LINE</legend>
    <p class="helptext">เลือกชุดงานที่พนักงานคนนี้รับแจ้ง ต้องมีสิทธิ์ กอจ. และเชื่อม LINE แล้ว เลือกผู้รับชุดเดียวกันได้หลายคน</p>
    {% for key,label,checked in choices %}<label class="choice"><input type="checkbox" name="koj_groups" value="{{ key }}"{% if checked %} checked{% endif %}><span>{{ label }}</span></label>{% endfor %}
    <p><button type="submit">บันทึกชุดรับแจ้ง กอจ.</button></p>
  </fieldset>
</form>
