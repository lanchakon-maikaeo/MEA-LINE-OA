<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>งานของกอง/ฝ่าย 3 ปุ่ม</title>
<style>
  * { margin: 0; }
  body { width: 2500px; height: 1686px; overflow: hidden; background: #06172a; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="2500" height="1686"></canvas>
<script>
// Draft only. Same colours, template and icons as operations/static/operations/line_menu.js,
// but frames are 9-sliced so the two big tiles and the full-width bar keep their corners.
// Open as work-3.html#staff or work-3.html#sup; add &nobar to leave out the เมนูเพิ่มเติม bar.
const BLUE = "#a5dcef", ORANGE = "#e9b38a", INK = "#f5f7fb";
const W = 2500, H = 1686, TAB_H = 230, BAR = 286;
const [role = "staff", flag] = location.hash.slice(1).split("&");
const HAS_BAR = flag !== "nobar";
const TABS = role === "sup" ? ["บริการ", "งานของกอง/ฝ่าย", "สั่งงาน"] : ["บริการ", "งานของกอง/ฝ่าย"];
const ctx = document.getElementById("c").getContext("2d");

function nine(img, sx, sy, sw, sh, dx, dy, dw, dh, c, k) {
  const d = c * k;
  const xs = [[sx, c, dx, d], [sx + c, sw - 2 * c, dx + d, dw - 2 * d], [sx + sw - c, c, dx + dw - d, d]];
  const ys = [[sy, c, dy, d], [sy + c, sh - 2 * c, dy + d, dh - 2 * d], [sy + sh - c, c, dy + dh - d, d]];
  ys.forEach(([y, h, ty, th]) => xs.forEach(([x, w, tx, tw]) => ctx.drawImage(img, x, y, w, h, tx, ty, tw, th)));
}

function tab(x, w, label, active) {
  const fill = ctx.createLinearGradient(0, 0, 0, TAB_H);
  fill.addColorStop(0, active ? "#89502f" : "#112b42");
  fill.addColorStop(1, active ? "#492b20" : "#071729");
  ctx.beginPath();
  ctx.roundRect(x + 18, 16, w - 36, TAB_H - 30, 30);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.lineWidth = active ? 5 : 3;
  ctx.strokeStyle = active ? ORANGE : "#5d9abb";
  ctx.stroke();
  text(label, x + w / 2, TAB_H / 2, 64);
}

function text(label, x, y, size) {
  // The released pictures use a looped Thai face; Latin labels keep the sans face of "Meter, CT, VT".
  const family = /[\u0E00-\u0E7F]/.test(label) ? "Thonburi" : '"Helvetica Neue"';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = INK;
  ctx.font = `700 ${size}px ${family}, sans-serif`;
  ctx.fillText(label, x, y);
}

function icon(draw, x, y, scale, accent) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 5;
  ctx.strokeStyle = accent;
  ctx.shadowColor = accent;
  ctx.shadowBlur = 6;
  draw();
  ctx.restore();
}

const stroke = (p) => ctx.stroke(new Path2D(p));

function task() {  // line_menu.js "task"
  ctx.beginPath();
  ctx.roundRect(-66, -82, 132, 164, 15);
  ctx.stroke();
  [-40, 0, 40].forEach((y) => stroke(`M -34 ${y} H 34`));
}

function megaphone() {  // the 64-unit icon from the earlier drafts, on line_menu.js's ±100 grid
  ctx.scale(3.3, 3.3);
  ctx.translate(-34, -33);
  ctx.lineWidth = 5 / 3.3;
  ["M10 26h8l22-12v36L18 38h-8a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z", "M18 26v12", "M14 38l4 14h6l-3-14",
   "M47 24c3 2 4.5 5 4.5 8s-1.5 6-4.5 8", "M52 17c5 4 8 9.5 8 15s-3 11-8 15"].forEach(stroke);
}

function grid() {  // line_menu.js fallback "grid", drawn small beside the bar label
  [-42, 42].forEach((dx) => [-42, 42].forEach((dy) => {
    ctx.beginPath();
    ctx.roundRect(dx - 27, dy - 27, 54, 54, 10);
    ctx.stroke();
  }));
}

(async () => {
  const art = new Image();
  art.src = "space-template.png";
  await art.decode();
  await document.fonts.load("700 64px Thonburi", "งานของกอง/ฝ่าย");

  ctx.fillStyle = "#06172a";
  ctx.fillRect(0, 0, W, H);

  const tw = W / TABS.length;
  TABS.forEach((label, i) => tab(i * tw, tw, label, i === 1));

  const gridH = H - TAB_H - (HAS_BAR ? BAR : 0), k = W / art.naturalWidth;
  const tiles = [
    { label: "งานสั่งที่ได้รับ", draw: task, col: 0, accent: BLUE },
    { label: "Broadcast", draw: megaphone, col: 1, accent: ORANGE },
  ];
  tiles.forEach((t, i) => {
    const x = i * W / 2, w = W / 2;
    // Template column 0 is a blue frame, column 1 an orange one (top row, 400 of 1030 px).
    nine(art, t.col * 509, 0, 509, 400, x, TAB_H, w, gridH, 110, k);
    icon(t.draw, x + w / 2, TAB_H + gridH * 0.40, 1.45, t.accent);
    text(t.label, x + w / 2, TAB_H + gridH * 0.70, 80);
  });

  if (!HAS_BAR) { document.title = "done"; return; }
  // เมนูเพิ่มเติม: the service page's orange bar, one bar across the full width.
  nine(art, 0, 824, 763, 206, 0, TAB_H + gridH, W, BAR, 95, k);
  const barY = TAB_H + gridH + BAR * 0.415;
  ctx.font = "700 90px Thonburi, sans-serif";
  const half = ctx.measureText("เมนูเพิ่มเติม").width / 2;
  icon(grid, W / 2 - half - 80, barY, 0.62, INK);
  text("เมนูเพิ่มเติม", W / 2 + 30, barY, 90);
  document.title = "done";
})();
</script>
</body>
</html>
